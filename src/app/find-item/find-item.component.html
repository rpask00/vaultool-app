<div class="container">
  <div class="video-wrapper">
    <video #videoEl [class.hidden]="!streaming()" autoplay playsinline></video>
    <div class="placeholder" [class.hidden]="streaming()">
      <span>Camera is off</span>
    </div>
  </div>

  <div class="controls">
    <button (click)="toggleCamera()" [class.danger]="streaming()">
      {{ streaming() ? 'Stop Camera' : 'Open Camera' }}
    </button>
    <button (click)="takePhoto()" [disabled]="!streaming()">📸 Take Photo</button>
  </div>

  <canvas #canvasEl class="hidden"></canvas>
</div>
