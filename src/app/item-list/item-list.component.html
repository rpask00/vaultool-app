<section
  class="w-full border-3 border-blue-500 bg-blue-500/20 text-blue-200 py-4 px-6 rounded-xl mt-5"
>
  @if (items$ | async; as items) {
    @for (item of items; track item.id) {
      <div class="flex w-full border-2 border-blue-400/20 my-3 p-3 rounded-lg">
        @if (item.files.length > 0) {
          <img
            class="w-50 rounded-lg mr-4"
            [src]="apiUrl +  '/uploads/' + item.files[0].id + '.' + item.files[0].ext"
          />
        }
        <div class="flex flex-col w-full">
          <h1 class="text-3xl font-semibold mb-3">{{ item.name }}</h1>
          <p class="text-1xl whitespace-break-spaces">{{ item.description }}</p>

          <div>
            <mat-chip-grid class="mt-3">
              @for (tag of item.tags; track tag) {
                <mat-chip>
                  {{ tag }}
                </mat-chip>
              }
            </mat-chip-grid>
          </div>

          <div class="flex w-full justify-end mt-auto gap-4">
            <button class="bg-red-400! text-red-100!" mat-mini-fab (click)="delete(item.id)">
              <mat-icon>delete</mat-icon>
            </button>
            <button mat-mini-fab (click)="edit(item)">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </div>
      </div>
    }
  }
</section>
