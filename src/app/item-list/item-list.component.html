<section
  class="w-full border-3 border-blue-500 bg-blue-500/20 text-blue-200 py-4 px-6 rounded-xl mt-5"
>
  @if (items$ | async; as items) {
    @for (item of items; track item.id) {
      <div class="flex w-full border my-3 p-3 rounded-lg">
        <img
          class="w-50 rounded-lg mb-3 mr-4"
          [src]="'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbRBhaI453iDIGK06ss86056q8aOGBuX_6lg&s'"
        />
        <div class="flex flex-col w-full">
          <h1 class="text-3xl font-semibold mb-3">{{ item.name }}</h1>
          <h1 class="text-1xl">{{ item.description }}</h1>

          <div>
            <mat-chip-grid class="mt-3">
              @for (tag of item.tags; track tag) {
                <mat-chip>
                  {{ tag }}
                </mat-chip>
              }
            </mat-chip-grid>
          </div>

          <div class="flex w-full justify-end mt-auto gap-4">
            <button class="bg-red-400! text-red-100!" mat-mini-fab (click)="delete(item.id)">
              <mat-icon>delete</mat-icon>
            </button>
            <button mat-mini-fab (click)="edit(item)">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </div>
      </div>
    }
  }
</section>
